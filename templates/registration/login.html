{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block breadcrumb %}Login{% endblock %}
{% block content %}
<div style="max-width:400px;margin:60px auto">
  <div class="card">
    <div class="card-header"><span class="card-title">Sign In</span></div>
    <div class="card-body">
      {% if form.errors %}
      <div class="msg msg-error" style="margin-bottom:16px">Invalid username or password.</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="form-group" style="margin-bottom:16px">
          <label style="display:block;font-size:12px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px">Username</label>
          <input type="text" name="username" autofocus required
            style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;padding:8px 12px;outline:none;box-sizing:border-box">
        </div>
        <div class="form-group" style="margin-bottom:24px">
          <label style="display:block;font-size:12px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px">Password</label>
          <input type="password" name="password" required
            style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;padding:8px 12px;outline:none;box-sizing:border-box">
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-primary" style="width:100%">Sign In</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
